<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Light a skyshot</title>
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--gold:#ffb627;--ink:#f6e9d0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:#04020c;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:none}
header{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;padding:16px 20px 0;text-align:center;pointer-events:none}
h1{font-family:"Yatra One",Georgia,serif;font-weight:400;font-size:clamp(26px,5.5vw,48px);margin:0;color:var(--gold);text-shadow:0 0 26px rgba(255,182,39,.5)}
header p{margin:6px 0 0;font-size:15px;opacity:.8;transition:opacity .8s}
#bar{position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:12px;pointer-events:none}
button{pointer-events:auto;font:inherit;font-size:16px;font-weight:600;border:0;border-radius:999px;padding:12px 22px;cursor:pointer}
#go{color:#1a0b00;background:var(--gold);box-shadow:0 0 22px rgba(255,182,39,.5)}
#go:hover{background:#ffc94d}
#fin{color:#fff;background:#d4246a;box-shadow:0 0 22px rgba(255,61,127,.5)}
#fin:hover{background:#ee3a82}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
#count{pointer-events:none;font-size:15px;opacity:.9;max-width:14em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#chg{color:var(--ink);background:rgba(255,255,255,.14);padding:10px 16px;font-size:14px}
#board{display:none;position:fixed;top:calc(env(safe-area-inset-top,0px) + 100px);left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 10px}
#rows{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.row{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;border-radius:999px;background:rgba(10,6,28,.74);border:2px solid var(--c);box-shadow:0 0 14px var(--c),inset 0 0 10px rgba(255,255,255,.06);font-weight:700;font-size:15px}
.row .rk{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--c);color:#1a0b00;font-size:13px}
.row .nm{max-width:11ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.row .sc{color:var(--c)}
.gold{--c:#ffb627}.silver{--c:#cfd9e6}.bronze{--c:#e58a4a}
.row.me{outline:2px solid #fff;outline-offset:2px}
#note{font-size:13px;opacity:.7;text-align:center}
#gate{position:fixed;inset:0;display:grid;place-items:center;background:rgba(4,2,12,.82);z-index:5;padding:20px}
#gate[hidden]{display:none}
.card{max-width:340px;width:100%;background:#120a2b;border:1px solid #3a2a6a;border-radius:18px;padding:24px;box-shadow:0 0 40px rgba(255,61,127,.25);text-align:center}
.card h2{font-family:"Yatra One",Georgia,serif;font-weight:400;color:var(--gold);margin:0 0 8px;font-size:26px}
.card p{margin:0 0 16px;font-size:15px;opacity:.85;line-height:1.45}
#nmi{width:100%;box-sizing:border-box;font:inherit;font-size:17px;padding:12px 14px;border-radius:12px;border:2px solid #3a2a6a;background:#07041a;color:var(--ink);margin-bottom:12px}
#nmi:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#ok{color:#1a0b00;background:var(--gold);width:100%}
#wish{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) scale(.92);width:min(90vw,460px);box-sizing:border-box;text-align:center;padding:20px 24px;border-radius:20px;background:rgba(18,10,43,.8);border:2px solid var(--gold);box-shadow:0 0 36px rgba(255,182,39,.55);pointer-events:none;opacity:0;transition:opacity .7s,transform .7s;z-index:4}
#wish.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#wish h2{font-family:"Yatra One",Georgia,serif;font-weight:400;color:var(--gold);margin:0 0 8px;font-size:clamp(22px,5.5vw,34px);overflow-wrap:anywhere}
#wish p{margin:0;font-size:clamp(16px,4vw,19px);line-height:1.45}
</style>
</head>
<body>
<canvas id="c" aria-label="Night sky over a lit city with skyshots, anars and chakris. Hold the glowing incense stick to a fuse to light it. Keys 1 to 9 also light them."></canvas>
<header><h1>Shubh Deepavali</h1><p id="hint">Drag the glowing stick to a fuse and hold it there</p></header>
<div id="board" aria-live="polite"><div id="rows"></div><div id="note"></div></div>
<div id="bar"><span id="count"></span><button id="chg" type="button" aria-label="Change name" title="Change name">✏️</button></div>
<div id="wish" aria-live="polite"><h2></h2><p></p></div>
<div id="gate" role="dialog" aria-modal="true" aria-labelledby="gt"><div class="card"><h2 id="gt">Who is lighting the sky?</h2><p>Your name goes on the board. Every skyshot you light is one point.</p><input id="nmi" maxlength="16" placeholder="Your name" autocomplete="nickname" aria-label="Your name"><button id="ok" type="button">Start lighting</button></div></div>
<script>
(function(){
var cv=document.getElementById('c'),g=cv.getContext('2d'),W,H,dpr,skyG,blds=[],stars=[];
var parts=[],rockets=[],fuses=[],lights=[],smoke=[],lit=0,actx=null,N=7,kinds=['sky','anar','sutli','chakri','fuljhari','sky','sutli','anar','chakri'],st=[],ptr={x:-99,y:-99,t:'mouse',on:false},last=performance.now(),clock=0,amb=0,ambH=30;
function rnd(a,b){return a+Math.random()*(b-a)}
function size(){dpr=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0);
skyG=g.createLinearGradient(0,0,0,H);skyG.addColorStop(0,'#03010a');skyG.addColorStop(.6,'#0b0620');skyG.addColorStop(1,'#2b0f30');
g.fillStyle=skyG;g.fillRect(0,0,W,H);
stars=[];for(var i=0;i<160;i++)stars.push({x:Math.random()*W,y:Math.random()*H*.65,r:rnd(.3,1.3),p:rnd(0,6.28)});
blds=[];var x=-10,base=H-96;while(x<W){var w=rnd(34,80),h=rnd(50,Math.min(190,H*.28)),b={x:x,w:w,h:h,win:[],roof:[]};
for(var wy=base-h+10;wy<base-14;wy+=14)for(var wx=x+6;wx<x+w-8;wx+=12)if(Math.random()<.45)b.win.push([wx,wy,rnd(0,6.28)]);
for(var rx=x+3;rx<x+w-2;rx+=9)b.roof.push([rx,rnd(0,360)]);blds.push(b);x+=w+rnd(-4,6)}}
addEventListener('resize',size);size();
function tubes(){var a=[],n=kinds.length;for(var i=0;i<n;i++){var k=kinds[i],x=W*(0.07+i*0.86/(n-1)),h=k==='sky'?52:(k==='anar'?46:12),o={x:x,y:H-96,w:k==='sky'?30:36,h:h,k:k,hue:i*55+10};o.wx=k==='chakri'?x+18:x;o.wy=k==='chakri'?o.y-10:o.y-h-(k==='sky'?10:5);a.push(o)}return a}
/* audio */
function audio(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(actx&&actx.state==='suspended')actx.resume()}
function noise(dur,fq,vol,delay,pw){if(!actx)return;var n=actx.currentTime+(delay||0),len=actx.sampleRate*dur|0,b=actx.createBuffer(1,len,actx.sampleRate),d=b.getChannelData(0);
for(var i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,pw||3);var s=actx.createBufferSource(),f=actx.createBiquadFilter(),v=actx.createGain();f.type='lowpass';f.frequency.value=fq;v.gain.value=vol;s.buffer=b;s.connect(f).connect(v).connect(actx.destination);s.start(n)}
function whistle(){if(!actx)return;noise(.25,350,.5,0,2);var o=actx.createOscillator(),v=actx.createGain(),n=actx.currentTime;o.type='sine';o.frequency.setValueAtTime(600,n);o.frequency.exponentialRampToValueAtTime(2000,n+.9);v.gain.setValueAtTime(.035,n);v.gain.linearRampToValueAtTime(0,n+.9);o.connect(v).connect(actx.destination);o.start(n);o.stop(n+.95)}
function boom(){var d=rnd(.05,.2);noise(1.4,450,.7,d,3);noise(.5,2500,.25,d,4)}
function crackle(){for(var k=0;k<7;k++)noise(.04,6000,.1,.2+k*rnd(.03,.14),2)}
/* lights, smoke, particles */
function addLight(x,y,r,h,a,d){lights.push({x:x,y:y,r:r,h:h,a:a,d:d})}
function add(x,y,vx,vy,o){if(parts.length>3600)return;parts.push({x:x,y:y,px:x,py:y,vx:vx,vy:vy,h:o.h,h2:o.h2,s:o.s==null?100:o.s,life:1,dec:o.dec,drag:o.drag||.98,gr:o.gr==null?.05:o.gr,sz:o.sz||1.8,gl:o.gl,crk:o.crk})}
function sph(x,y,o){for(var i=0;i<o.n;i++){var u=Math.random()*2-1,a=Math.random()*6.283,r=Math.sqrt(1-u*u),s=o.s*(o.spread?rnd(.3,1):rnd(.93,1));
var h=o.multi?rnd(0,360):o.h;add(x,y,Math.cos(a)*r*s,Math.sin(a)*r*s,{h:h,h2:o.h2,dec:o.dec*rnd(.85,1.2),drag:o.drag,gr:o.gr,gl:o.gl,crk:o.crk,sz:o.sz})}}
function shape(x,y,o,fx){var tilt=rnd(0,3.14);for(var i=0;i<o.n;i++){var a=6.283*i/o.n,p=fx(a),c=Math.cos(tilt),sn=Math.sin(tilt),px=p[0]*o.s,py=p[1]*o.s;
add(x,y,px*c-py*sn*.0+0,py*(o.flat?1:1)*1+0,{h:o.h,h2:o.h2,dec:o.dec,drag:.975,gr:.035,gl:o.gl,sz:2})}}
function burst(x,y){boom();shake=Math.max(shake,4);buzz(25);var t=Math.random(),h=rnd(0,360),h2=(h+rnd(100,200))%360,sm=0;
addLight(x,y,Math.max(H,W)*.55,h,1,.04);addLight(x,y,120,h,1.2,.12);
if(t<.18){sph(x,y,{n:140,s:6.4,h:h,h2:h2,dec:.012});sph(x,y,{n:40,s:2.6,h:(h+180)%360,dec:.016})}
else if(t<.34){sph(x,y,{n:170,s:6.2,h:h,dec:.008,gl:1,drag:.982,spread:1});crackle()}
else if(t<.48){sph(x,y,{n:130,s:4.6,h:rnd(30,48),dec:.0055,drag:.972,gr:.03,gl:1,spread:1});addLight(x,y,300,40,.8,.03)}
else if(t<.6){shape(x,y,{n:80,s:5.8,h:h,h2:h2,dec:.013},function(a){return[Math.cos(a),Math.sin(a)*.4]});sph(x,y,{n:50,s:3.2,h:h2,dec:.015})}
else if(t<.7){shape(x,y,{n:110,s:.38,h:rnd(320,350),dec:.011},function(a){return[16*Math.pow(Math.sin(a),3)*.95,-(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a))]})}

else{sph(x,y,{n:150,s:6,h:h,h2:h2,dec:.011,crk:1});crackle()}
for(var m=0;m<5;m++)smoke.push({x:x+rnd(-40,40),y:y+rnd(-30,30),r:rnd(30,60),a:.1,vx:rnd(-.1,.2),vy:rnd(-.05,.05)});
if(smoke.length>70)smoke.splice(0,smoke.length-70)}
/* shots */
function launch(i,tx,ty,fast){if(!name)return;audio();var T=tubes()[i];fuses.push({i:i,t:0,lim:fast?8:36,tx:tx,ty:ty});lit++;scoreChanged();document.getElementById('hint').style.opacity=0}
function fire(f){var T=tubes()[f.i];whistle();addLight(T.x,T.y-T.h,160,38,.9,.1);var ty=f.ty!=null?f.ty:H*rnd(.14,.5),tx=f.tx!=null?f.tx:T.x+rnd(-.12,.12)*W,sy=T.y-T.h,dist=Math.max(sy-ty,90),vy=-Math.sqrt(2*.12*dist);

/* player name, score, shared top 3 */
var name='',base=0,ready=false,uid=null,db=null,mode='local',lb=[],saveT=null,lastSaved=null,postFail=false;
var gate=document.getElementById('gate'),inp=document.getElementById('nmi');
try{name=(localStorage.getItem('diwali-name')||'').slice(0,16)}catch(e){}
function total(){return base+lit}
function myId(){return mode==='cloud'?uid:'me'}
function mk(tag,cls,txt){var e=document.createElement(tag);e.className=cls;e.textContent=txt;return e}
function render(){var rows=document.getElementById('rows');rows.textContent='';var list=mode==='cloud'?lb:(name?[{id:'me',name:name,score:total()}]:[]),med=['gold','silver','bronze'];
for(var i=0;i<3;i++){var e=list[i],d=mk('div','row '+med[i]+(e&&e.id===myId()?' me':''),'');d.appendChild(mk('span','rk',i+1));d.appendChild(mk('span','nm',e?e.name:'Open spot'));d.appendChild(mk('span','sc',e?e.score:'-'));rows.appendChild(d)}
document.getElementById('note').textContent=mode!=='cloud'?'Scores stay on this device. The shared board needs a signed-in viewer.':(postFail?'You can see the board, but your score is not posted (view-only access).':'');
document.getElementById('count').textContent=name?name+': '+total():''}
function save(){if(!db||!ready||!name||postFail)return;var key=name+'|'+total();if(key===lastSaved)return;lastSaved=key;db.doc('scores/'+uid).set({name:name,score:total()}).catch(function(){postFail=true;render()})}
function scoreChanged(){render();clearTimeout(saveT);saveT=setTimeout(save,1000)}
var wishT=null;
function showWish(){var w=document.getElementById('wish');w.querySelector('h2').textContent='Happy Diwali 2026, '+name+'!';w.querySelector('p').textContent='Wishing you & family a very Happy & Prosperous Diwali 🎇🪔';w.classList.add('show');clearTimeout(wishT);wishT=setTimeout(function(){w.classList.remove('show')},6500);for(var k=0;k<3;k++)(function(k){setTimeout(function(){burst(W*rnd(.25,.75),H*rnd(.18,.38))},300+k*600)})(k)}
function setName(n){n=n.replace(/\s+/g,' ').trim().slice(0,16);if(!n){inp.focus();return}name=n;try{localStorage.setItem('diwali-name',n)}catch(e){}gate.hidden=true;audio();scoreChanged();showWish()}
document.getElementById('ok').addEventListener('click',function(){setName(inp.value)});
inp.addEventListener('keydown',function(e){if(e.key==='Enter')setName(inp.value)});
document.getElementById('chg').addEventListener('click',function(){inp.value=name;gate.hidden=false;inp.focus();inp.select()});
inp.value=name;gate.hidden=!!name;if(!name)setTimeout(function(){inp.focus()},50);if(name)setTimeout(showWish,400);
render();
if(false&&window.claude&&claude.use){Promise.all([claude.use('db'),claude.use('user')]).then(function(r){var d=r[0],u=r[1];if(!d||!u)return;return u.id().then(function(id){if(!id)return;uid=id;db=d;
d.doc('scores/'+id).get().then(function(s){if(s.exists){base=+(s.data().score)||0}ready=true;mode='cloud';scoreChanged()},function(){});
d.collection('scores').orderBy('score','desc').limit(3).onSnapshot(function(s){lb=s.docs.map(function(x){var v=x.data()||{};return{id:x.id,name:String(v.name||'Player').slice(0,16),score:+v.score||0}});mode='cloud';render()},function(){mode='local';render()})})}).catch(function(){})}
/* frame */
/* manual lighting: incense stick, anar, chakri */
function pm(e){ptr.x=e.clientX;ptr.y=e.clientY;ptr.t=e.pointerType;ptr.on=true}
cv.addEventListener('pointermove',pm);cv.addEventListener('pointerdown',function(e){pm(e);audio()});
function ignite(i,s){if(!name)return;audio();noise(.2,5000,.12,0,2);document.getElementById('hint').style.opacity=0;if(kinds[i]==='sky'){s.s='spent';s.t=0;launch(i);return}lit++;scoreChanged();s.s='fuse';s.t=0;s.a=0;s.dx=0}
function burn(t,s,dt){var k=t.k,x=t.x+(s.dx||0),dur=k==='anar'?330:280,p=s.t/dur;if(p>=1){s.s='spent';s.t=0;return}
var I=p<.1?p*10:(p>.7?(1-p)/.3:1),tick=Math.floor(s.t/10)!==Math.floor((s.t-dt)/10);
if(k==='anar'){var top=t.y-t.h,n=Math.round(4.5*I*dt+Math.random()),hh=rnd(0,360);
for(var j=0;j<n;j++){var a=rnd(-.38,.38),sp=rnd(4,9.5)*(.55+.45*I),c=Math.random()<.2?rnd(0,360):rnd(30,55);add(x+rnd(-4,4),top,Math.sin(a)*sp,-Math.cos(a)*sp,{h:c,dec:rnd(.018,.03),drag:.985,gr:.11,gl:Math.random()<.4,sz:1.5})}
if(tick){addLight(x,top-70,280,Math.random()<.5?40:hh,.38*I,.09);noise(.22,3500,.05*I,0,1)}}
else{s.a=(s.a||0)+(.3+.4*I)*dt;s.dx=Math.max(-22,Math.min(22,(s.dx||0)+rnd(-.7,.7)*dt));
for(var r=0;r<3;r++){var th=s.a+r*2.094,sx=t.x+s.dx+Math.cos(th)*14,sy=t.y-5+Math.sin(th)*5;add(sx,sy,Math.cos(th)*rnd(1.5,3.5)-Math.sin(th)*rnd(0,2.5),Math.sin(th)*rnd(.2,.8)-rnd(.8,3),{h:Math.random()<.25?rnd(0,360):rnd(30,52),dec:.045,drag:.96,gr:.09,sz:1.4})}
if(tick){addLight(t.x+s.dx,t.y-22,170,40,.34*I,.1);noise(.15,6000,.04*I,0,1)}}}
function drawOne(t,s){var x=t.x+(s.dx||0),y=t.y,k=t.k,sp=s.s==='spent',bn=s.s==='burn';g.globalCompositeOperation='source-over';
if(k==='sky'){g.fillStyle=sp?'#2a1c2a':'#1c0f2e';g.fillRect(x-t.w/2,y-t.h,t.w,t.h);g.fillStyle=sp?'#4a3a3a':'hsl('+t.hue+',90%,55%)';g.fillRect(x-t.w/2,y-t.h+10,t.w,6);g.fillRect(x-t.w/2,y-12,t.w,4);g.fillStyle='#0b0620';g.fillRect(x-t.w/2-3,y-t.h-4,t.w+6,6);
if(!sp){g.fillStyle='rgba(255,255,255,.85)';g.beginPath();g.moveTo(x,y-t.h+20);g.lineTo(x-5,y-t.h+33);g.lineTo(x+5,y-t.h+33);g.closePath();g.fill();g.fillStyle='#f4d58a';g.fillRect(x-1,y-t.h-14,2,10)}}
else if(k==='anar'){var bw=36,tw=24,h=t.h,wd=function(f){return bw-(bw-tw)*f};g.fillStyle=sp?'#3b2118':'#c4421a';g.beginPath();g.moveTo(x-bw/2,y);g.lineTo(x+bw/2,y);g.lineTo(x+tw/2,y-h);g.lineTo(x-tw/2,y-h);g.closePath();g.fill();
g.fillStyle=sp?'#5a4a22':'#ffb627';g.beginPath();g.moveTo(x-wd(.3)/2,y-h*.3);g.lineTo(x+wd(.3)/2,y-h*.3);g.lineTo(x+wd(.42)/2,y-h*.42);g.lineTo(x-wd(.42)/2,y-h*.42);g.closePath();g.fill();
for(var d=-1;d<=1;d++){g.beginPath();g.arc(x+d*7,y-h*.66,2,0,6.28);g.fill()}
g.fillStyle='#5a1a0a';g.fillRect(x-tw/2-2,y-h-3,tw+4,4);if(!sp){g.fillStyle='#f4d58a';g.fillRect(x-1,y-h-11,2,8)}}
else{var rx=17,ry=6;g.save();g.translate(x,y-5);g.fillStyle=sp?'#2a1a18':'#d9342b';g.beginPath();g.ellipse(0,0,rx,ry,0,0,6.283);g.fill();
g.strokeStyle=sp?'#4a3a30':'#ffd24a';g.lineWidth=1.6;for(var q=0;q<3;q++){var a0=(s.a||0)+q*2.094;g.beginPath();for(var u=0;u<=1.01;u+=.1){var an=a0+u*5,rr=u*rx;g.lineTo(Math.cos(an)*rr,Math.sin(an)*rr*(ry/rx))}g.stroke()}
